[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mediaruntime"
version = "0.2.2"
description = "Official Python SDK for the MediaRuntime API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MediaRuntime" }]
keywords = ["mediaruntime", "transcoding", "video", "audio", "image"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Homepage = "https://mediaruntime.com"
Documentation = "https://mediaruntime.com/docs"
Issues = "https://github.com/ericel/mediaruntime-python-sdk/issues"
Repository = "https://github.com/ericel/mediaruntime-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaruntime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mediaruntime"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
